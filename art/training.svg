<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="A shopkeeper teacher points at a blackboard of the shop's ledger, marking one decision wrong and showing the right one, while a robot student at a desk takes notes">
  <style>
    .tr-point { animation: tr-point 2.6s ease-in-out infinite; transform-box: view-box; transform-origin: 498px 300px; }
    @keyframes tr-point { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
    .tr-write { animation: tr-write 1.2s ease-in-out infinite alternate; }
    @keyframes tr-write { from { transform: translate(0, 0); } to { transform: translate(18px, 2px); } }
    .tr-tick { stroke-dasharray: 60; animation: tr-tick 2.6s ease-in-out infinite; }
    @keyframes tr-tick { 0%, 30% { stroke-dashoffset: 60; } 55%, 100% { stroke-dashoffset: 0; } }
    .tr-bulb { animation: tr-bulb 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes tr-bulb { 0%, 45% { opacity: 0; transform: scale(.6); } 60%, 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; } }
    .tr-blink { animation: tr-blink 4s steps(1) infinite; }
    @keyframes tr-blink { 0%, 90% { opacity: 1; } 91%, 95% { opacity: 0; } }
    .tr-bubble { animation: tr-bubble 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 80% 100%; }
    @keyframes tr-bubble { 0%, 8% { transform: scale(0); } 16%, 86% { transform: scale(1); } 94%, 100% { transform: scale(0); } }
    .tr-chalk { font-family: "Baloo 2", system-ui, sans-serif; font-weight: 700; fill: #fff8ec; stroke: none; }
    .tr-t { font-family: "Baloo 2", system-ui, sans-serif; font-weight: 800; fill: #1f1a2e; stroke: none; }
    .tr-s { font-family: Nunito, system-ui, sans-serif; font-weight: 900; fill: #1f1a2e; stroke: none; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="800" height="560" fill="#e6f6f4"/>
  <rect x="0" y="448" width="800" height="112" fill="#c98a4b"/>
  <path d="M0 448 H800" stroke="#1f1a2e" stroke-width="3"/>

  <g stroke="#1f1a2e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">

    <!-- blackboard -->
    <rect x="40" y="34" width="440" height="270" rx="10" fill="#c98a4b"/>
    <rect x="54" y="48" width="412" height="242" rx="4" fill="#2f5d50"/>
    <text x="74" y="84" class="tr-chalk" font-size="22">Day 3 · turn 14 · खाता</text>
    <path d="M74 94 H446" stroke="#fff8ec" stroke-width="2" opacity=".6"/>
    <text x="74" y="130" class="tr-chalk" font-size="20">Agent: order 50 kg dal</text>
    <path d="M330 112 L352 134 M352 112 L330 134" stroke="#ff8a8a" stroke-width="5"/>
    <text x="74" y="172" class="tr-chalk" font-size="20">Owner: order 20 kg dal</text>
    <path class="tr-tick" d="M330 160 L340 172 L362 146" fill="none" stroke="#b6f0c0" stroke-width="5"/>
    <text x="74" y="212" class="tr-chalk" font-size="16" opacity=".85">why: shelf has 2 days of stock,</text>
    <text x="74" y="234" class="tr-chalk" font-size="16" opacity=".85">cash is short, dal keeps</text>
    <text x="74" y="272" class="tr-chalk" font-size="18" style="fill:#ffb020">practice shop #7 · next turn →</text>
    <rect x="380" y="290" width="40" height="10" rx="3" fill="#fff8ec"/>

    <!-- teacher: the scripted owner -->
    <g>
      <!-- pointer arm -->
      <g class="tr-point">
        <path d="M498 300 Q470 266 440 230" fill="none" stroke-width="16" stroke="#1f1a2e"/>
        <path d="M498 300 Q470 266 440 230" fill="none" stroke-width="10" stroke="#ffffff"/>
        <circle cx="436" cy="226" r="9" fill="#c68642"/>
        <path d="M434 222 L360 160" stroke="#8b5a2b" stroke-width="5"/>
      </g>
      <!-- body (kurta) -->
      <path d="M470 446 L478 330 Q480 290 530 288 Q580 290 582 330 L590 446Z" fill="#ffffff"/>
      <path d="M530 292 V360" stroke-width="2.5"/>
      <circle cx="530" cy="312" r="2.5" fill="#1f1a2e"/><circle cx="530" cy="330" r="2.5" fill="#1f1a2e"/>
      <!-- waistcoat -->
      <path d="M494 300 Q500 360 498 420 H516 L522 300Z M566 300 Q560 360 562 420 H544 L538 300Z" fill="#ff7a29"/>
      <!-- other arm holding a register -->
      <path d="M576 306 Q600 346 586 382" fill="none" stroke-width="16" stroke="#1f1a2e"/>
      <path d="M576 306 Q600 346 586 382" fill="none" stroke-width="10" stroke="#ffffff"/>
      <rect x="556" y="364" width="52" height="40" rx="4" fill="#e8407a" transform="rotate(-10 582 384)"/>
      <path d="M566 378 H596 M566 388 H592" stroke="#fff8ec" stroke-width="2" transform="rotate(-10 582 384)"/>
      <!-- head -->
      <rect x="520" y="268" width="20" height="22" fill="#c68642"/>
      <circle cx="530" cy="246" r="32" fill="#c68642"/>
      <path d="M498 250 Q496 222 506 216 Q502 234 506 246Z M562 250 Q564 222 554 216 Q558 234 554 246Z" fill="#d9d9e3"/>
      <g fill="none" stroke-width="2.5"><circle cx="518" cy="246" r="9"/><circle cx="544" cy="246" r="9"/><path d="M527 246 H535"/></g>
      <path d="M516 262 Q530 256 544 262 Q538 268 530 264 Q522 268 516 262Z" fill="#d9d9e3"/><path d="M524 272 Q530 275 536 272" fill="none" stroke-width="2"/>
      <!-- legs -->
      <path d="M490 446 V448 M572 446 V448"/>
      <path d="M484 446 Q480 456 500 456 H520 V446Z M540 446 V456 H564 Q584 456 578 446Z" fill="#1f1a2e"/>
    </g>
    <text x="530" y="490" text-anchor="middle" class="tr-s" font-size="14" style="fill:#fff8ec">teacher: a scripted owner</text><text x="716" y="490" text-anchor="middle" class="tr-s" font-size="14" style="fill:#fff8ec">student: the agent</text>

    <!-- speech bubble -->
    <g class="tr-bubble">
      <rect x="566" y="40" width="210" height="72" rx="16" fill="#fff"/>
      <path d="M584 112 L560 150 L612 112Z" fill="#fff"/>
      <text x="671" y="70" text-anchor="middle" class="tr-s" font-size="15">Itna maal mat mangao,</text>
      <text x="671" y="94" text-anchor="middle" class="tr-s" font-size="15">paisa phas jayega.</text>
    </g>
    <text x="671" y="26" text-anchor="middle" class="tr-s" font-size="10.5" opacity=".75">“Don't order so much; the cash gets stuck.”</text>

    <!-- student desk -->
    <rect x="614" y="372" width="170" height="16" rx="4" fill="#ffb020"/>
    <path d="M628 388 V446 M770 388 V446" stroke-width="6"/>
    <!-- notebook -->
    <path d="M632 370 L648 352 H712 L700 370Z" fill="#fff8ec"/>
    <path d="M654 358 H698 M650 364 H692" stroke-width="1.5"/>

    <!-- robot student -->
    <rect x="690" y="300" width="80" height="74" rx="18" fill="#e3e5f5"/>
    <rect x="702" y="314" width="56" height="30" rx="8" fill="#3d3a8c"/>
    <text x="730" y="335" text-anchor="middle" class="tr-t" font-size="13" style="fill:#ffb020">AGENT</text>
    <rect x="716" y="282" width="28" height="20" rx="5" fill="#c9cbe0"/>
    <rect x="682" y="214" width="96" height="72" rx="22" fill="#e3e5f5"/>
    <rect x="694" y="228" width="72" height="42" rx="12" fill="#1f1a2e"/>
    <g class="tr-blink" stroke="none"><rect x="708" y="238" width="12" height="16" rx="6" fill="#8fd6d0"/><rect x="740" y="238" width="12" height="16" rx="6" fill="#8fd6d0"/></g>
    <path d="M720 260 Q730 264 740 260" fill="none" stroke="#8fd6d0" stroke-width="2.5"/>
    <path d="M730 214 V196" stroke-width="4"/><circle cx="730" cy="190" r="7" fill="#e8407a"/>
    <!-- writing arm -->
    <path d="M694 322 Q664 340 668 360" fill="none" stroke-width="14" stroke="#1f1a2e"/>
    <path d="M694 322 Q664 340 668 360" fill="none" stroke-width="8" stroke="#c9cbe0"/>
    <g class="tr-write"><circle cx="668" cy="362" r="8" fill="#c9cbe0"/><path d="M664 366 L656 356" stroke="#e8407a" stroke-width="4"/></g>
    <!-- idea bulb -->
    <g class="tr-bulb">
      <circle cx="790" cy="214" r="0" fill="none" stroke="none"/>
      <path d="M756 164 Q756 144 772 142 Q788 144 788 164 Q788 174 780 180 V188 H764 V180 Q756 174 756 164Z" fill="#ffe08a"/>
      <path d="M764 192 H780" stroke-width="3"/>
      <path d="M748 146 L740 140 M772 132 V124 M792 150 L798 146" stroke="#ffb020" stroke-width="3"/>
    </g>

    <!-- stack of practice shops on the floor -->
    <g>
      <rect x="44" y="384" width="62" height="40" fill="#ffe08a"/><path d="M40 386 H110 L104 398 H46Z" fill="#ff7a29"/>
      <rect x="116" y="392" width="54" height="32" fill="#ffe08a"/><path d="M112 394 H174 L168 404 H118Z" fill="#e8407a"/>
      <rect x="70" y="344" width="58" height="40" fill="#ffe08a"/><path d="M66 346 H132 L126 358 H72Z" fill="#0f8b8d"/>
      <path d="M40 446 Q40 424 60 424 H170 Q190 424 190 446Z" fill="#8a8396"/>
      <text x="115" y="442" text-anchor="middle" class="tr-s" font-size="11" style="fill:#fff8ec">practice shops</text>
    </g>
  </g>
</svg>
